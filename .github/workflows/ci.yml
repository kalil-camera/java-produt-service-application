name: Application Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Backend Build & Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven # Demonstra preocupação com performance de build

      - name: Run Unit and Integration Tests
        # O Ubuntu do GitHub Actions já possui o Docker daemon rodando.
        # O Testcontainers vai subir o PostgreSQL efêmero automaticamente aqui.
        run: mvn clean verify

      - name: Build Docker Image
        # Simula a criação do artefato final para o ECS
        run: docker build -t senior-project-api:latest .

  infrastructure-check:
    name: IaC Validation (Terraform)
    runs-on: ubuntu-latest
    needs: build-and-test # Só valida a infra se o código Java passar
    defaults:
      run:
        working-directory: ./terraform
        
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        # O parâmetro -backend=false impede que ele tente conectar na AWS
        # Ele apenas baixa os módulos locais para validação
        run: terraform init -backend=false

      - name: Terraform Format Check
        # O avaliador verá que você garante a padronização do código IaC
        run: terraform fmt -check

      - name: Terraform Validate
        # Valida se a sua lógica de VPC, ECS, ALB e RDS está sintaticamente correta
        run: terraform validate